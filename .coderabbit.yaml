# CodeRabbit settings for Flatbed: reviews pull requests into main (the same shape as Unmarked's and Rounds' settings)
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  # built output, vendored pdf-lib and Tesseract, language data, fonts, binary test files and Android tooling: not our
  # code, or generated from it. src/clean.js is a byte-for-byte copy of Unmarked's cleaner (a test checks it), reviewed
  # and fixed in the Unmarked repository. (The script that makes the test files, tests/fixtures/*.py, is still reviewed.)
  path_filters:
    - "!dist/**"
    - "!src/vendor/**"
    - "!src/fonts/**"
    - "!src/lang/**"
    - "!src/clean.js"
    - "!tests/fixtures/**/*.jpg"
    - "!tests/fixtures/**/*.gz"
    - "!mobile/package-lock.json"
    - "!mobile/android/gradle/**"
    - "!mobile/android/gradlew"
    - "!mobile/android/gradlew.bat"
    - "!mobile/android/app/src/main/res/mipmap-*/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.woff2"
  path_instructions:
    - path: "**"
      instructions: |
        Flatbed scans documents into PDFs entirely on the device: it finds the page in a photo, flattens and cleans
        it up, recognises the text (Tesseract, offline, language data built in) and writes a PDF. By design it has
        no network access: the page's Content Security Policy has connect-src 'none' (it also covers the two
        workers), and the Android app has no INTERNET and no CAMERA permission (the phone's own camera app takes the
        photo). Nothing is uploaded or stored apart from a few option settings and a usage count. Every photo is
        untrusted input. Focus on: anything from a photo file that could reach the PDF (pages must be redrawn from
        pixels, never copied); untrusted text reaching the page unescaped or altering the PDF's structure; input
        that could crash, hang or run out of memory; and anything that could send data off the device.
    - path: "src/scan.js"
      instructions: |
        The image pipeline on plain pixel arrays (page finding, perspective, straightening, clean-up, black and
        white), and pictureSize/tooLarge, which read a picture's size from its header before anything decodes it.
        Check bounds on every header read and that the size limit can't be bypassed by a crafted header.
    - path: "src/work.js"
      instructions: |
        The page worker: decodes photos (createImageBitmap) only after the header size check, and returns only
        pictures drawn afresh. Check that nothing from the original file is passed on.
    - path: "src/pdf.js"
      instructions: |
        Writes the PDF with pdf-lib: images, and an invisible text layer written as hexadecimal character codes.
        Check that recognised text can't alter the PDF's structure and that no metadata (title, author, app, dates,
        document IDs) is written.
    - path: "src/app.js"
      instructions: |
        File names and everything found in files are untrusted: they must never reach innerHTML without escaping.
        The PDF screen must never say the PDF is clean when the check found something.
    - path: "src/native.js"
      instructions: |
        Bridge to the Android app (reading picked, shared or camera files in pieces, saving, sharing). Check size
        limits are applied before reading, and error handling.
    - path: "mobile/**/*.java"
      instructions: |
        Android plugin: check intent handling (only content:// files from other apps are accepted, never Flatbed's
        own files), that files are written only where the person chose in the save screen, that the private cache
        (camera, share) is emptied, what is exported, and that nothing needs or uses internet or camera permissions.
    - path: "build.mjs"
      instructions: |
        Builds the single-file page and its HTTP headers. Check the Content Security Policy and headers stay strict
        and that nothing external is loaded.
    - path: "tests/**"
      instructions: |
        Tests run on real or generated files. Check that each test would actually fail if the behaviour it
        describes broke.
    - path: ".github/workflows/**"
      instructions: |
        Release pipeline using the studio's signing key. Three jobs: build (read-only, unsigned APK, no secrets),
        sign (read-only, runs no repository code, in the protected "signing" environment that holds the key and
        needs the owner's approval), publish (the only job with contents: write). Actions are pinned to exact
        commits. Check secret handling, permissions and supply-chain risks.
